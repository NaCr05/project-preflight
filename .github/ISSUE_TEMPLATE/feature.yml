name: Feature request
description: Propose a bounded improvement to Project Preflight
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or repeated maintenance cost exists today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior, not only an implementation idea.
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Most relevant area
      options:
        - Public Project Preflight entry
        - Discovery Adapter
        - Decision Adapter
        - Specification Adapter
        - Ticketing Adapter
        - State or evidence runtime
        - Evaluation or release tooling
        - Documentation or distribution
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Examples or evidence
      description: Add sanitized examples, expected acceptance criteria, or links.
  - type: checkboxes
    id: boundaries
    attributes:
      label: Workflow boundaries
      options:
        - label: The proposal preserves one public `$project-preflight` entry or explains why that decision should be reopened.
          required: true
        - label: The proposal does not require production implementation before Gate 4.
          required: true
