name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify release candidate
        run: |
          python -m unittest discover -s tests -v
          python skills/project-preflight/scripts/sync_contract.py --check
          python skills/project-preflight/scripts/preflight_state.py template --check skills/project-preflight/assets/preflight-template.md

      - name: Match tag to Plugin version
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open(".codex-plugin/plugin.json", encoding="utf-8"))["version"])')"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Build release archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          zip -r "dist/project-preflight-${version}.zip" \
            .codex-plugin skills LICENSE README.md README.zh-CN.md THIRD_PARTY_NOTICES.md
          sha256sum "dist/project-preflight-${version}.zip" > "dist/project-preflight-${version}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
