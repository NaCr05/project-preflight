name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Compile Python sources
        run: python -m compileall -q skills evals tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check canonical contract projections
        run: python skills/project-preflight/scripts/sync_contract.py --check

      - name: Check derived state template
        run: python skills/project-preflight/scripts/preflight_state.py template --check skills/project-preflight/assets/preflight-template.md

      - name: Load behavior-eval manifest
        run: python evals/run_behavior_evals.py list
